source = $HOME/.config/hypr/colors.conf

general {
    hide_cursor = true
}

# Static blurred wallpaper background (stable, zero screenshot lag/crashes)
background {
    monitor =
    path = $image
    color = $surface
    blur_passes = 3
    blur_size = 6
    noise = 0.015
    contrast = 0.85
    brightness = 0.65
}

# Clock
label {
    monitor =
    text = $TIME
    color = $primary
    font_size = 94
    font_family = Elianto
    position = 0, 300
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +'%A, %d %B')"
    color = $on_surface_variant
    font_size = 18
    font_family = Varela Round
    position = 0, 210
    halign = center
    valign = center
}



# Input Field
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2

    outer_color = $primary
    inner_color = rgba(0, 0, 0, 0)
    font_color = $on_surface

    fade_on_empty = true
    placeholder_text = Enter the Password

    rounding = 12
    position = 0, -30
    halign = center
    valign = center
}

