# Music Song Title
label {
    monitor =
    text = cmd[update:1000] echo "$(playerctl metadata title 2>/dev/null || echo 'No Media Playing')"
    color = $on_surface
    font_size = 13
    font_family = Comfortaa Bold
    position = 0, -190
    halign = center
    valign = center
}

# Music Artist
label {
    monitor =
    text = cmd[update:1000] echo "$(playerctl metadata artist 2>/dev/null)"
    color = $on_surface_variant
    font_size = 11
    font_family = Comfortaa
    position = 0, -215
    halign = center
    valign = center
}

# Battery Status Widget (Updates dynamically via sysfs)
label {
    monitor =
    text = cmd[update:5000] echo "󰁹 $(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || echo '100')% ($(cat /sys/class/power_supply/BAT0/status 2>/dev/null || echo 'Discharging'))"
    color = $on_surface_variant
    font_size = 12
    font_family = Comfortaa
    position = 0, -250
    halign = center
    valign = center
}

# Quote at bottom
label {
    monitor =
    text = I cant see me cry ever again
    color = $on_surface_variant
    font_size = 14
    font_family = Google Sans
    position = 0, 30
    halign = center
    valign = bottom
}
