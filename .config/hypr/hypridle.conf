general {
    lock_cmd = pidof hyprlock || hyprlock       # dbus/sysd lock command
    before_sleep_cmd = pidof hyprlock || hyprlock    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # to turn on the screen after sleep
}

# 5 min: Lock and Screen Off
listener {
    timeout = 300                                # 5 mins
    on-timeout = hyprlock                        # lock screen
}

listener {
    timeout = 300                                # 5 mins
    on-timeout = hyprctl dispatch dpms off       # screen off
    on-resume = hyprctl dispatch dpms on         # screen on when activity is detected
}

# 10 min: Suspend
listener {
    timeout = 600                                # 10 mins
    on-timeout = systemctl suspend               # suspend pc
}
