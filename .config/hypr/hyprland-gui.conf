# Generated by HyprMod


# Environment
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24

cursor:inactive_timeout = 0
cursor:no_warps = true
cursor:warp_on_change_workspace = 1
decoration:blur:popups = true
decoration:blur:special = false
decoration:dim_strength = 0.3
decoration:inactive_opacity = 0.9
decoration:shadow:enabled = false
dwindle:smart_split = false
general:gaps_out = 8
general:layout = dwindle
master:allow_small_split = true
master:new_on_top = true

# Keybinds
unbind = , XF86AudioMicMute
bind = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Window rules
windowrule = match:class ^(org\.gnome\.Nautilus)$, float on
windowrule = match:class ^(chrome\-hnpfjngllnobngcgfapefoaidbinmjnm\-Default)$, match:class ^(org\.gnome\.Nautilus)$, opacity 0.70 0.55
windowrule = match:class ^(org\.gnome\.Characters)$, float on
windowrule = match:class ^(org\.pulseaudio\.pavucontrol)$, float on
windowrule = match:class ^(blueman\-manager)$, float on
windowrule = match:class ^(org\.gnome\.Calculator)$, float on
windowrule = match:class ^(org\.kde\.kdeconnect\.app)$, float on
windowrule = match:class ^(dev\.zed\.Zed)$, opacity 0.85 0.70
windowrule = match:class ^(chrome\-hnpfjngllnobngcgfapefoaidbinmjnm\-Default)$, opacity 0.80 0.70
windowrule = match:class ^(org\.kde\.kdeconnect\.app)$, size 900 550
windowrule = match:class ^(code)$, opacity 0.85 0.75
windowrule = match:class ^(org\.gnome\.Loupe)$, float on
windowrule = match:class ^(mpv)$, float on
windowrule = match:class ^(org\.gnome\.clocks)$, float on
windowrule = match:class ^(org\.gnome\.clocks)$, size 600 350
windowrule = match:class ^(kitty)$, opacity 0.85 0.75
windowrule = match:class ^(matplotlib)$, float on
windowrule = match:class ^(matplotlib)$, move 100 100
windowrule = match:class ^(Matplotlib)$, float on
windowrule = match:class ^(Chromium\-browser)$, pin on
windowrule = match:class ^(org\.gnome\.TextEditor)$, float on
windowrule = match:class ^(org\.kde\.kdeconnect\.daemon)$, size 680 520
