# ============================================================
#  hyprland.conf 
# ============================================================

# ── Sources ────────────────────────────────────────────────
source = ~/.config/hypr/colors.conf


# ── Monitors ────────────────────────────────────────────────

source = ~/.config/hypr/monitors.conf


# ── Variables ───────────────────────────────────────────────

$terminal    = kitty
$fileManager = nautilus
$menu        = rofi -show drun -theme ~/.config/rofi/tokyonight.rasi
$browser     = firefox
$scripts     = ~/.config/hypr/scripts
$quickshell  = ~/.config/quickshell/components/
$mainMod     = SUPER

# ── Autostart ───────────────────────────────────────────────
#exec-once = sleep 1 && QML_XHR_ALLOW_FILE_READ=1 quickshell --path ~/.config/quickshell/shell.qml
exec-once = awww-daemon
#exec-once = waybar
exec-once = nm-applet
exec-once = blueman-applet
exec-once = mpris-proxy
#exec-once = kdeconnect-indicator
exec-once = hypridle
exec-once = swayosd-server
exec-once = libinput-gestures-setup start
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
#exec-once = swaybg -i /home/priyam/Pictures/wallpapers/fixed.jpg -m fill
exec-once = ~/.config/hypr/scripts/battery_alert.sh
exec-once = ~/.config/hypr/scripts/hdmi_auto.sh &

#exec-once = quickshell	
exec-once = QML_XHR_ALLOW_FILE_READ=1 quickshell --path ~/.config/quickshell/shell.qml
exec-once = hyprpm reload -n
#exec-once = tide-island
#exec-once = socat -U - UNIX-CONNECT:$XDG_RUNTIME_DIR/hypr/$HYPRLAND_INSTANCE_SIGNATURE/.socket2.sock | while read -r line; do [[ "$line" =~ ^bell ]] && pw-play /usr/share/sounds/alsa/Front_Center.wav; done

# ── Environment ─────────────────────────────────────────────

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

#wayland backends
env = GDK_BACKEND,               wayland,x11
env = QT_QPA_PLATFORM,           wayland;xcb
env = QT_QPA_PLATFORMTHEME,      gtk3
env = EGL_PLATFORM,              wayland
#gtk
env = GTK_CSD,                   0         # disable client-side decorations
env = GTK_OVERLAY_SCROLLING,     1

# ── General ─────────────────────────────────────────────────

general {
    gaps_in             = 5
    gaps_out            = 8
    border_size         = 2
    col.active_border   = $primary $tertiary 45deg          # from colors.conf
    col.inactive_border = $surface_container
    layout              = dwindle
    resize_on_border    = true
}

# ── Decoration ──────────────────────────────────────────────

decoration {
    rounding         = 14
    active_opacity   = 1.0
    inactive_opacity = 1.0  # slightly dim unfocused windows

    blur {
        enabled            = true
        size               = 8
        passes             = 4
        vibrancy           = 0.15
        vibrancy_darkness  = 0.3
        noise              = 0.008
        contrast           = 0.9
        brightness         = 0.9
        popups             = true
        popups_ignorealpha = 0.3
    }

    shadow {
        enabled        = false
        range          = 30
        render_power   = 3
        color          = rgba(00000055)
        color_inactive = rgba(00000030)
        offset         = 0, 4
    }
}

# ── Animations ──────────────────────────────────────────────

animations {
    enabled = yes

    # custom bezier curves
    bezier = wind,   0.05, 0.9,  0.1, 1.05  # slight overshoot
    bezier = winIn,  0.1,  1.1,  0.1, 1.1   # bouncy enter
    bezier = winOut, 0.3, -0.3,  0,   1      # quick exit
    bezier = liner,  1,    1,    1,   1      # linear (for border)

    animation = windows,     1, 1,  wind,   slide
    animation = windowsIn,   1, 1,  winIn,  slide
    animation = windowsOut,  1, 1,  winOut, slide
    animation = windowsMove, 1, 1,  wind,   slide
    animation = border,      1, 1,  liner
    # animation = borderangle, 1, 15, liner, loop     # spinning border gradient
    animation = fade,        1, 1,  default
    animation = workspaces,  1, 1,  wind,   slidefade 100%
}

# ── Layout ──────────────────────────────────────────────────

dwindle {
    force_split            = 0
    special_scale_factor   = 0.8   # scratchpad window size
    split_width_multiplier = 1.0
    use_active_for_splits  = true
   # pseudotile             = yes
    preserve_split         = yes   # keep split direction after closing windows
}

master{
    new_status = master
}


# ── Misc ────────────────────────────────────────────────────
misc {
    disable_hyprland_logo        = true
    force_default_wallpaper      = 0
    vrr                          = 0     # variable refresh rate
    animate_manual_resizes       = true
    animate_mouse_windowdragging = true
    focus_on_activate            = true
}

# ── Input ───────────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    numlock_by_default = true
    sensitivity = 0.5 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}
#cursor {
#    no_hardware_cursors = true
#}
# ── Keybinds ────────────────────────────────────────────────

# apps
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, B, exec, flatpak run app.zen_browser.zen
bind = $mainMod, Z, exec, /home/priyam/.local/zed.app/bin/zed
bind = $mainMod, period, exec, omniglyph

# utils
bind = $mainMod, C, killactive,
#bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod, A, exec, quickshell ipc call wallpaper toggle
bind = $mainMod, N, exec, quickshell ipc call dashboard toggle
bind = $mainMod, F, exec, quickshell ipc call focus toggle
bind = $mainMod, X, exec, quickshell ipc call music toggle
bind = $mainMod, D, exec, quickshell ipc call pdf toggle
bind = $mainMod, G, exec, quickshell ipc call github toggle
bind = ALT, W, exec, quickshell ipc call wifi toggle
bind = ALT, B, exec, quickshell ipc call bt toggle
bind = ALT, K, exec, quickshell ipc call kdeconnect toggle
bind = $mainMod ALT, R, exec, pkill quickshell; QML_XHR_ALLOW_FILE_READ=1 quickshell --path ~/.config/quickshell/shell.qml --daemonize
bind = $mainMod, L, exec, hyprlock
bind = , PRINT, exec, grim -g "$(slurp)" - | swappy -f -
bind = SHIFT, PRINT, exec, grim ~/Pictures/screenshot-$(date +%s).png
# bind = $mainMod, SPACE, exec, rofi -show drun -theme ~/.config/rofi/tokyonight.rasi
bind = SUPER SHIFT, F23, exec, pkill rofi || rofi -show drun -theme ~/.config/rofi/tokyonight.rasi
bind = ALT, V, exec, ~/.config/rofi/clipboard.sh
bind = SUPER SHIFT, P, exec, ~/.config/hypr/scripts/hdmi_toggle.sh
bind = , XF86Display, exec, ~/.config/hypr/scripts/hdmi_toggle.sh


# focus 
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# wlogout
bind = $mainMod, Escape, exec, pkill wlogout || wlogout --buttons-per-row 6 --column-spacing 0 --row-spacing 0 --margin-top 430 --margin-bottom 430 --margin-left 460 --margin-right 460
layerrule {
    name = logout_dialog
    blur = on
}

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace 
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# scratchpad
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# master layout options
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod ALT, mouse:272, resizewindow

# Laptop multimedia keys 
bindl = , switch:Lid Switch, exec, loginctl lock-session
bind = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bind = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower

bind = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle

bind = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bind = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

bind = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle

# Media control
bindl = , XF86AudioNext, exec, playerctl -p $(cat /tmp/current_mpris_player 2>/dev/null || echo '%any') next
bindl = , XF86AudioPause, exec, playerctl -p $(cat /tmp/current_mpris_player 2>/dev/null || echo '%any') play-pause
bindl = , XF86AudioPlay, exec, playerctl -p $(cat /tmp/current_mpris_player 2>/dev/null || echo '%any') play-pause
bindl = , XF86AudioPrev, exec, playerctl -p $(cat /tmp/current_mpris_player 2>/dev/null || echo '%any') previous
bindl = , XF86AudioStop, exec, playerctl -p $(cat /tmp/current_mpris_player 2>/dev/null || echo '%any') stop

